# ============================================================
# Intégration continue : vérifie le dépôt, construit le site et conserve l'archive à déposer sur l'hébergement.
#
# Quand : à chaque pull request vers main, à chaque push sur main, et à la demande (onglet Actions, « Run workflow »).
# Une nouvelle exécution sur la même référence (branche ou pull request) annule la précédente, devenue inutile.
# La pull request et le commit du pipeline IA (update-dataset.yml) sont faits avec le GITHUB_TOKEN. Quand le pipeline crée
# ou met à jour sa pull request, ce workflow démarre en attente d'approbation : une personne qui a le droit d'écriture sur
# le dépôt clique sur « Approve workflows to run » dans la pull request. Le commit direct sur main ne le déclenche pas :
# le lancer à la main (« Run workflow »), ce qui fonctionne toujours.
#
# Ce que le job « verifier » fait, dans cet ordre :
#   1. vérification de types du core, du backend, de l'app mobile et du site ;
#   2. lint du site, garde de charte SFG (puis son autotest) et tests du site ;
#   3. tests du core et du backend ;
#   4. build du site : export statique dans apps/web/out ;
#   5. dépôt de apps/web/out en artefact « site-hostinger », conservé 30 jours. include-hidden-files est
#      indispensable : sans lui, le .htaccess serait exclu de l'artefact.
#
# Le build télécharge les polices Google (Montserrat, Inter) par next/font. Aucun secret n'est utilisé.
# Ce workflow ne publie rien : le dépôt sur Hostinger se fait à la main (docs/deploiement-site.md).
#
# Échecs étrangers au code : npm ci dépend du registre npm, et le build du site du téléchargement des polices Google.
# Relancer le job avant de chercher une cause dans le dépôt.
#
# Les tests ne dépendent pas de la date du jour : l'alerte de fraîcheur des données (dernière vérification de plus de
# 12 mois) est exclue de npm test et lancée chaque lundi par update-dataset.yml, sans bloquer ; une pull request ne
# passe donc pas au rouge parce que le temps a passé. La revue annuelle est décrite dans docs/donnees-aides.md.
# ============================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck core
        run: npm run typecheck --workspace @opco/core

      - name: Typecheck backend
        run: npm run typecheck --workspace @opco/backend

      - name: Typecheck app mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

      - name: Typecheck site
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Lint du site
        run: npm run lint --workspace web

      - name: Garde de charte SFG
        run: npm run check:charte

      - name: Autotest de la garde de charte
        run: node scripts/check-charte-sfg.mjs --self-test

      - name: Garde des tirets cadratins (tout le dépôt)
        run: npm run check:tirets

      - name: Tests du site
        run: npm run test:web

      - name: Tests core
        run: npm test --workspace @opco/core

      - name: Tests backend
        run: npm test --workspace @opco/backend

      - name: Build du site (export statique)
        run: npm run build --workspace web

      - name: Archive du site (artefact site-hostinger)
        uses: actions/upload-artifact@v7
        with:
          name: site-hostinger
          path: apps/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
